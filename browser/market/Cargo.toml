[package]
name = "turf-market-workbench"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "turf-market-workbench-cli"
path = "src/main.rs"

[dependencies]
turf-core = { path = "../../turf-core" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
wasm-bindgen = "=0.2.127"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
